[project]
name = "portlab-backend"
version = "0.1.0"
description = "PortLab 后端 —— 个人投资分析工具箱"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic-settings>=2.5",
    "akshare>=1.14",
    "pandas>=2.0",
    "scipy>=1.11",
    "tushare>=1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

# 不声明 [build-system]：uv 将其视为虚拟项目（应用），
# `uv sync` 只安装 dependencies，不构建/安装项目自身。

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
