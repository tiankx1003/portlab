services:
  mysql:
    image: mysql:8.4
    container_name: portlab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portlab}
      MYSQL_USER: ${MYSQL_USER:-portlab}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portlabpass}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    container_name: portlab-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-portlab}
      DB_PASS: ${MYSQL_PASSWORD:-portlabpass}
      DB_NAME: ${MYSQL_DATABASE:-portlab}
      DATA_SOURCE: ${DATA_SOURCE:-akshare}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # MCP server（026）：容器间探测地址；前端展示用默认 localhost:8020
      PORTLAB_MCP_URL: http://mcp:8020/mcp
    ports:
      - "8010:8010"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./:/repo:ro
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]

  mcp:
    build: ./mcp_server
    container_name: portlab-mcp
    restart: unless-stopped
    environment:
      # 容器间走服务名 backend；契约表挂载到 /docs/api-registry.yaml（整个 docs 目录挂载，
      # 避免 ./mcp_server:/app 下再单文件挂载在 Docker Desktop VirtioFS 下报 mountpoint 冲突）
      PORTLAB_API_BASE: http://backend:8010/api
      MCP_HTTP_PORT: "8020"
      MCP_HOST: "0.0.0.0"
      MCP_REGISTRY_PATH: /docs/api-registry.yaml
    ports:
      - "8020:8020"
    depends_on:
      - backend
    volumes:
      - ./docs:/docs:ro
      - ./mcp_server:/app
      - /app/.venv
    command: [".venv/bin/python", "-m", "portlab_mcp.server"]

  frontend:
    build: ./frontend
    container_name: portlab-frontend
    restart: unless-stopped
    environment:
      # 透传给 vite（见 frontend/vite.config.ts）；留空走默认
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_BACKEND_TARGET: ${VITE_BACKEND_TARGET:-http://backend:8010}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
